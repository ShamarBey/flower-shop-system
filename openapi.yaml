openapi: 3.0.3
info:
  title: Flower Shop Orders and Inventory API
  description: REST API информационной системы управления заказами и товарными запасами цветочного магазина с конструктором букетов.
  version: 1.0.0
  license:
    name: Educational project
    url: https://github.com/ShamarBey/flower-shop-system
  contact:
    name: Flower Shop System

servers:
  - url: /api/v1
    description: Локальный сервер разработки

tags:
  - name: Health
    description: Работоспособность серверного процесса (реализовано в лабораторной №3)
  - name: Auth
    description: Регистрация, вход и текущий пользователь
  - name: Catalog
    description: Каталог цветов, упаковки и дополнительных товаров
  - name: Bouquets
    description: Черновики и проверка индивидуальных букетов
  - name: Orders
    description: Создание и обработка заказов
  - name: Inventory
    description: Остатки и складские движения

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Проверить работоспособность серверного процесса
      operationId: getHealth
      security: []
      description: Публичная проверка жизни процесса. Не проверяет готовность PostgreSQL или Redis. uptime — секунды с запуска сервиса по монотонным часам.
      responses:
        '200':
          description: Процесс работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/register:
    post:
      tags: [Auth]
      summary: Регистрация клиента
      operationId: registerCustomer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Клиент зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email уже зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Вход в систему
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Токен выдан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Получить текущего пользователя
      operationId: getCurrentUser
      responses:
        '200':
          description: Профиль текущего пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /products:
    get:
      tags: [Catalog]
      summary: Получить каталог товаров
      operationId: listProducts
      security: []
      description: Публичный каталог. Неактивные товары видят только менеджер и администратор с действительным JWT; для остальных is_active=false возвращает 403.
      parameters:
        - $ref: '#/components/parameters/CategoryIdQuery'
        - name: product_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductType'
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Страница каталога
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Catalog]
      summary: Создать товар каталога
      operationId: createProduct
      description: Доступно менеджеру и администратору.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Товар создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductIdPath'
    get:
      tags: [Catalog]
      summary: Получить товар по идентификатору
      operationId: getProduct
      security: []
      responses:
        '200':
          description: Товар найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Catalog]
      summary: Частично обновить товар
      operationId: updateProduct
      description: Доступно менеджеру и администратору.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPatchRequest'
      responses:
        '200':
          description: Товар обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Catalog]
      summary: Архивировать товар
      operationId: archiveProduct
      description: Физическое удаление не выполняется; товар помечается неактивным. Доступно менеджеру и администратору.
      responses:
        '204':
          description: Товар архивирован
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /bouquet-drafts:
    get:
      tags: [Bouquets]
      summary: Получить черновики букетов клиента
      operationId: listBouquetDrafts
      description: Только собственные черновики текущего клиента. Чужие черновики никогда не включаются в ответ.
      responses:
        '200':
          description: Список черновиков
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BouquetDraftResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Bouquets]
      summary: Создать черновик букета
      operationId: createBouquetDraft
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BouquetDraftCreateRequest'
      responses:
        '201':
          description: Черновик создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BouquetDraftResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /bouquet-drafts/{draftId}:
    parameters:
      - $ref: '#/components/parameters/DraftIdPath'
    get:
      tags: [Bouquets]
      summary: Получить черновик букета
      operationId: getBouquetDraft
      description: Только владелец черновика. Для чужого UUID возвращается 404, чтобы не раскрывать его существование.
      responses:
        '200':
          description: Черновик найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BouquetDraftResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /bouquet-drafts/{draftId}/items:
    post:
      tags: [Bouquets]
      summary: Добавить компонент в букет
      operationId: addBouquetItem
      description: Только владелец черновика. Для чужого UUID возвращается 404. Товар не должен уже присутствовать в составе; дубликат возвращает 409.
      parameters:
        - $ref: '#/components/parameters/DraftIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BouquetItemRequest'
      responses:
        '201':
          description: Компонент добавлен, цена пересчитана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BouquetDraftResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /bouquet-drafts/{draftId}/items/{itemId}:
    patch:
      tags: [Bouquets]
      summary: Изменить количество компонента
      operationId: updateBouquetItem
      description: Только владелец черновика; itemId должен принадлежать draftId. Цена пересчитывается сервером, резерв не создается.
      parameters:
        - $ref: '#/components/parameters/DraftIdPath'
        - $ref: '#/components/parameters/ItemIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              additionalProperties: false
              properties:
                quantity:
                  type: number
                  minimum: 0.001
      responses:
        '200':
          description: Количество обновлено, цена пересчитана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BouquetDraftResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Bouquets]
      summary: Удалить компонент из букета
      operationId: removeBouquetItem
      description: Только владелец черновика; itemId должен принадлежать указанному draftId. Чужой или отсутствующий ресурс возвращает 404.
      parameters:
        - $ref: '#/components/parameters/DraftIdPath'
        - $ref: '#/components/parameters/ItemIdPath'
      responses:
        '204':
          description: Компонент удален
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /bouquet-drafts/{draftId}/validations:
    post:
      tags: [Bouquets]
      summary: Проверить состав и цену букета
      operationId: validateBouquetDraft
      description: Только владелец черновика; чужой UUID возвращает 404. Проверка не создает резерв. Сервер пересчитывает цену и наличие по текущим данным.
      parameters:
        - $ref: '#/components/parameters/DraftIdPath'
      responses:
        '200':
          description: Результат проверки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BouquetValidationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders:
    get:
      tags: [Orders]
      summary: Получить заказы
      operationId: listOrders
      description: Клиент получает только собственные заказы. Менеджер, флорист и администратор видят заказы магазина; кладовщик получает 403.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Страница заказов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Orders]
      summary: Создать заказ из валидного букета
      operationId: createOrder
      description: Заказ создается только из собственного черновика клиента. Чужой или отсутствующий draft_id возвращает 404. Цены рассчитывает сервер; для DELIVERY обязателен непустой delivery_address, для PICKUP он не используется. scheduled_at должен быть в будущем. Проверка остатков и резерв выполняются в одной транзакции PostgreSQL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: Заказ создан, остатки зарезервированы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Недостаточно товара для резерва
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Получить заказ
      operationId: getOrder
      description: Доступен владельцу, менеджеру, флористу и администратору. Другой клиент или кладовщик получает 403.
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          description: Заказ найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/status:
    patch:
      tags: [Orders]
      summary: Изменить статус заказа
      operationId: updateOrderStatus
      description: Менеджер и администратор проводят допустимые переходы. Флорист может только CONFIRMED -> ASSEMBLING и ASSEMBLING -> READY. Недопустимая для роли операция возвращает 403, переход из неподходящего состояния — 409. Для отмены используется операция cancelOrder, которая освобождает резерв.
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdateRequest'
      responses:
        '200':
          description: Статус обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orders/{orderId}/cancellations:
    post:
      tags: [Orders]
      summary: Отменить заказ
      operationId: cancelOrder
      description: Владелец может отменить только NEW или CONFIRMED; менеджер и администратор — также NEEDS_APPROVAL. Для ASSEMBLING, READY, COMPLETED и CANCELLED возвращается 409. Изменение статуса, запись истории и освобождение резерва выполняются атомарно.
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Заказ отменен, резерв освобожден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /inventory/stock:
    get:
      tags: [Inventory]
      summary: Получить складские остатки
      operationId: listStockBalances
      description: Доступно кладовщику, менеджеру и администратору.
      parameters:
        - name: warehouse_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/ProductIdQuery'
        - name: only_available
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Остатки товаров
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockBalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /inventory/movements:
    post:
      tags: [Inventory]
      summary: Создать складское движение
      operationId: createStockMovement
      description: Приход или списание. Доступно кладовщику и администратору. Резервирование, освобождение и расход по заказу выполняются только внутренней логикой заказа. Нельзя списать зарезервированные товары; недостаток доступного остатка возвращает 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovementRequest'
      responses:
        '201':
          description: Складское движение создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProductIdPath:
      name: productId
      in: path
      required: true
      description: UUID товара
      schema:
        type: string
        format: uuid
    DraftIdPath:
      name: draftId
      in: path
      required: true
      description: UUID черновика букета
      schema:
        type: string
        format: uuid
    ItemIdPath:
      name: itemId
      in: path
      required: true
      description: UUID позиции букета
      schema:
        type: string
        format: uuid
    OrderIdPath:
      name: orderId
      in: path
      required: true
      description: UUID заказа
      schema:
        type: string
        format: uuid
    CategoryIdQuery:
      name: category_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    ProductIdQuery:
      name: product_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Unauthorized:
      description: Требуется аутентификация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Конфликт состояния ресурса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Ошибка проверки входных данных
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      required: [status, app_name, version, environment, uptime]
      properties:
        status:
          type: string
          enum: [pass]
        app_name:
          type: string
          example: Flower Shop API
        version:
          type: string
          example: 1.0.0
        environment:
          type: string
          enum: [development, test, production]
        uptime:
          type: number
          minimum: 0
          description: Время с запуска сервиса в секундах
          example: 12.345
    UUID:
      type: string
      format: uuid
      example: 123e4567-e89b-12d3-a456-426614174000
    UserRole:
      type: string
      enum: [CUSTOMER, MANAGER, STOCKKEEPER, FLORIST, ADMIN]
    UserResponse:
      type: object
      required: [id, email, full_name, roles]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        email:
          type: string
          format: email
          example: client@example.com
        full_name:
          type: string
          example: Анна Иванова
        phone:
          type: string
          nullable: true
          example: '+79991234567'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
    RegisterRequest:
      type: object
      required: [email, password, full_name, phone]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        full_name:
          type: string
          minLength: 2
          maxLength: 255
        phone:
          type: string
          minLength: 10
          maxLength: 30
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/UserResponse'

    ProductType:
      type: string
      enum: [FLOWER, PACKAGING, DECOR, SERVICE]
    Product:
      type: object
      required: [id, category_id, sku, name, product_type, unit, price, min_quantity, is_active]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        category_id:
          $ref: '#/components/schemas/UUID'
        sku:
          type: string
          example: ROSE-RED-001
        name:
          type: string
          example: Роза красная
        product_type:
          $ref: '#/components/schemas/ProductType'
        unit:
          type: string
          example: stem
        price:
          type: number
          format: double
          minimum: 0
          example: 350
        min_quantity:
          type: number
          format: double
          minimum: 0.001
          example: 1
        max_quantity:
          type: number
          format: double
          nullable: true
          example: 99
        is_active:
          type: boolean
    ProductCreateRequest:
      type: object
      required: [category_id, sku, name, product_type, unit, price]
      properties:
        category_id:
          $ref: '#/components/schemas/UUID'
        sku:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 255
        product_type:
          $ref: '#/components/schemas/ProductType'
        unit:
          type: string
          example: stem
        price:
          type: number
          format: double
          minimum: 0
        min_quantity:
          type: number
          format: double
          minimum: 0.001
          default: 1
        max_quantity:
          type: number
          format: double
          minimum: 0.001
          nullable: true
        is_active:
          type: boolean
          default: true
    ProductPatchRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 255
        price:
          type: number
          format: double
          minimum: 0
        min_quantity:
          type: number
          format: double
          minimum: 0.001
        max_quantity:
          type: number
          format: double
          minimum: 0.001
          nullable: true
        is_active:
          type: boolean
    ProductListResponse:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    BouquetDraftCreateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          example: Букет для мамы
        recipe_id:
          type: string
          format: uuid
          nullable: true
    BouquetItemRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          $ref: '#/components/schemas/UUID'
        quantity:
          type: number
          format: double
          minimum: 0.001
          example: 7
    BouquetDraftItem:
      type: object
      required: [id, product_id, product_name, quantity, unit_price, line_total]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        product_id:
          $ref: '#/components/schemas/UUID'
        product_name:
          type: string
        quantity:
          type: number
          format: double
        unit_price:
          type: number
          format: double
        line_total:
          type: number
          format: double
          description: Вычисляется сервером как цена за единицу × количество; в базе не хранится.
    BouquetDraftResponse:
      type: object
      required: [id, name, items, total_price, is_valid, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/BouquetDraftItem'
        total_price:
          type: number
          format: double
        is_valid:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BouquetValidationResponse:
      type: object
      required: [valid, total_price, errors, warnings]
      properties:
        valid:
          type: boolean
        total_price:
          type: number
          format: double
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        unavailable_product_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'

    FulfillmentType:
      type: string
      enum: [DELIVERY, PICKUP]
    OrderStatus:
      type: string
      enum: [NEW, CONFIRMED, NEEDS_APPROVAL, ASSEMBLING, READY, COMPLETED, CANCELLED]
    OrderCreateRequest:
      type: object
      required: [draft_id, fulfillment_type, scheduled_at]
      properties:
        draft_id:
          $ref: '#/components/schemas/UUID'
        fulfillment_type:
          $ref: '#/components/schemas/FulfillmentType'
        delivery_address:
          type: string
          nullable: true
          example: г. Симферополь, ул. Ленина, 10
        scheduled_at:
          type: string
          format: date-time
        comment:
          type: string
          maxLength: 1000
          nullable: true
    OrderItem:
      type: object
      required: [id, product_id, product_name, unit_price, quantity, line_total]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        product_id:
          $ref: '#/components/schemas/UUID'
        product_name:
          type: string
        unit_price:
          type: number
          format: double
        quantity:
          type: number
          format: double
        line_total:
          type: number
          format: double
          description: round(unit_price_snapshot × quantity, 2); расчетное поле ответа, в базе не хранится.
    OrderResponse:
      type: object
      required: [id, number, status, fulfillment_type, items, subtotal, delivery_fee, total, created_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        number:
          type: string
          example: FS-20261015-0001
        status:
          $ref: '#/components/schemas/OrderStatus'
        fulfillment_type:
          $ref: '#/components/schemas/FulfillmentType'
        delivery_address:
          type: string
          nullable: true
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        subtotal:
          type: number
          format: double
          description: Сумма вычисленных line_total; в базе не хранится.
        delivery_fee:
          type: number
          format: double
        total:
          type: number
          format: double
          description: subtotal + delivery_fee; в базе не хранится.
        created_at:
          type: string
          format: date-time
    OrderListResponse:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderResponse'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
    OrderStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [CONFIRMED, NEEDS_APPROVAL, ASSEMBLING, READY, COMPLETED]
        comment:
          type: string
          maxLength: 1000
    CancelOrderRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500

    StockBalanceResponse:
      type: object
      required: [warehouse_id, product_id, on_hand, reserved, available]
      properties:
        warehouse_id:
          $ref: '#/components/schemas/UUID'
        product_id:
          $ref: '#/components/schemas/UUID'
        on_hand:
          type: number
          format: double
        reserved:
          type: number
          format: double
        available:
          type: number
          format: double
    MovementType:
      type: string
      description: Тип ручного движения; операции резервирования и продажи выполняются системой внутри заказа.
      enum: [RECEIPT, WRITE_OFF]
    StockMovementRequest:
      type: object
      required: [warehouse_id, product_id, movement_type, quantity, reason]
      properties:
        warehouse_id:
          $ref: '#/components/schemas/UUID'
        product_id:
          $ref: '#/components/schemas/UUID'
        movement_type:
          $ref: '#/components/schemas/MovementType'
        quantity:
          type: number
          format: double
          minimum: 0.001
        reason:
          type: string
          minLength: 1
          maxLength: 255
        order_id:
          type: string
          format: uuid
          nullable: true
    StockMovementResponse:
      allOf:
        - $ref: '#/components/schemas/StockMovementRequest'
        - type: object
          required: [id, created_by, created_at]
          properties:
            id:
              $ref: '#/components/schemas/UUID'
            created_by:
              $ref: '#/components/schemas/UUID'
            created_at:
              type: string
              format: date-time

    ErrorResponse:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Поле quantity должно быть больше нуля
        details:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
