<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flower Shop API — Swagger UI</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../node_modules/swagger-ui-dist/swagger-ui.css" />
  </head>
  <body>
    <p style="font-family: sans-serif; padding: 12px 24px">Проектный контракт API: 23 операции. В лабораторной №3 реализован только GET /api/v1/health. Для проверки запущенного сервера откройте его /docs.</p>
    <div id="swagger-ui"></div>
    <script src="../node_modules/swagger-ui-dist/swagger-ui-bundle.js"></script>
    <script>
      window.onload = () => {
        window.ui = SwaggerUIBundle({
          url: "../openapi.yaml",
          dom_id: "#swagger-ui",
          deepLinking: true,
          displayRequestDuration: true,
          validatorUrl: null,
          supportedSubmitMethods: [],
          presets: [SwaggerUIBundle.presets.apis],
          layout: "BaseLayout"
        });
      };
    </script>
  </body>
</html>
